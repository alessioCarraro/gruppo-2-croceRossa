<main class="app-container">
  
  <!-- Header -->
  <header class="header">
    <button class="icon-button back-btn" aria-label="Indietro" (click)="goBack()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <h1 class="title">Prossimi a scadenza</h1>
    
    <!-- L'interpolazione rimane invariata, ma ora totalItems() è dinamico -->
    <div class="badge-notification" [attr.aria-label]="totalItems() + ' articoli in scadenza'">
      {{ totalItems() }} art.
    </div>
  </header>

  <!-- Tabella Prodotti -->
  <section class="table-card">
    <!-- Intestazione Tabella -->
    <div class="table-header">
      <div class="col-prodotto">PRODOTTO</div>
      <div class="col-lotto">LOTTO</div>
      <div class="col-qta">QTÀ</div>
      <div class="col-scad">SCAD.</div>
    </div>

    <!-- Righe Prodotti -->
    <div class="table-body">
      @for (prodotto of prodotti(); track prodotto.id; let isLast = $last) {
        <div class="table-row" [class.border-bottom]="!isLast">
          <div class="col-prodotto text-dark">{{ prodotto.nome }}</div>
          <div class="col-lotto text-gray">{{ prodotto.lotto }}</div>
          <div class="col-qta text-dark">{{ prodotto.quantita }}</div>
          <div class="col-scad">
            <span class="scadenza-badge" [class.badge-urgent]="prodotto.urgente" [class.badge-normal]="!prodotto.urgente">
              {{ prodotto.dataScadenza }}
            </span>
          </div>
        </div>
      }
    </div>
  </section>

  <!-- Banner Informativo -->
  <section class="info-banner">
    <div class="info-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    </div>
    <p class="info-text">Dai priorità a questi prodotti nelle prossime consegne.</p>
  </section>

</main>
