<main class="user-screen">
  <header class="header">
    <button class="back-button" aria-label="Torna indietro">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18L9 12L15 6" stroke="#1C2B39" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 class="title">Utenti delle sedi</h1>
    <span class="count-badge">{{ totalUsers() }}</span>
  </header>

  <p class="subtitle">Utenti attualmente attivi, con la relativa sede.</p>

  <section class="user-list-container">
    @for (user of userContacts(); track user.id) {
      <article class="user-card">
        <div class="user-avatar">
          {{ user.initials }}
        </div>
        
        <div class="user-details">
          <h2 class="user-name">{{ user.name }}</h2>
          <p class="user-location">{{ user.location }}</p>
        </div>

        <button class="edit-button" (click)="editUser(user)" aria-label="Modifica utente">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
        </button>
      </article>
    }
  </section>
</main>
