<main class="inventory-screen">
  <header class="header">
    <button class="back-button" aria-label="Indietro">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18L9 12L15 6" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 class="title">Inventario</h1>
    <span class="total-badge">1.284 art.</span>
  </header>

  <section class="search-section">
    <div class="search-bar">
      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" placeholder="Cerca nel magazzino..." class="search-input" />
    </div>
  </section>

  <nav class="filter-chips">
    @for (filter of filters(); track filter) {
      <button 
        class="chip" 
        [class.active]="activeFilter() === filter"
        (click)="selectFilter(filter)">
        {{ filter }}
      </button>
    }
  </nav>

  <div class="info-banner">
    <svg class="info-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B6BBD" stroke-width="2">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="16" x2="12" y2="12"></line>
      <line x1="12" y1="8" x2="12.01" y2="8"></line>
    </svg>
    <p class="info-text">
      Vista di sola consultazione dell'inventario.
    </p>
  </div>

  <section class="inventory-list">
    @for (item of inventoryItems(); track item.id) {
      <article class="inventory-card">
        <div class="item-icon-wrapper">
          <svg class="item-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.5">
            <rect x="3" y="8" width="18" height="13" rx="2"></rect>
            <path d="M8 8V6C8 4.89543 8.89543 4 10 4H14C15.1046 4 16 4.89543 16 6V8"></path>
          </svg>
        </div>
        
        <div class="item-details">
          <h2 class="item-name">{{ item.name }}</h2>
          <p class="item-meta">
            Giacenza <strong>{{ item.stock }}</strong> &middot; scad 
            <span [class.expiring-soon]="item.isExpiringSoon">{{ item.expiryDate }}</span>
          </p>
        </div>

        <div class="item-quantity">
          <span class="quantity-number">{{ item.quantity }}</span>
          <div class="quantity-badge">T</div>
        </div>
      </article>
    }
  </section>
</main>
