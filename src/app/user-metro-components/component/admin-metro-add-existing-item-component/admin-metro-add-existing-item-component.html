<main class="app-container">
  <div class="scrollable-content">
    <header class="header">
      <button class="back-button" aria-label="Torna indietro">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 18L9 12L15 6" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1 class="title">Carico esistente</h1>
    </header>

    <form class="form-container" (submit)="saveLoad(); $event.preventDefault()">
      
      <!-- Macro-categoria -->
      <div class="form-group">
        <label class="form-label">Macro-categoria</label>
        <div class="custom-input">
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6862" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="6" x2="20" y2="6"></line>
            <line x1="4" y1="18" x2="20" y2="18"></line>
          </svg>
          <span class="input-value">{{ macroCategory() }}</span>
          <svg class="chevron-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6862" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>

      <!-- Categoria -->
      <div class="form-group">
        <label class="form-label">Categoria</label>
        <div class="custom-input">
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6862" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="6" x2="20" y2="6"></line>
            <line x1="4" y1="18" x2="20" y2="18"></line>
          </svg>
          <span class="input-value">{{ category() }}</span>
          <svg class="chevron-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6862" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>

      <!-- Tipo prodotto -->
      <div class="form-group">
        <label class="form-label">Tipo prodotto</label>
        <div class="custom-input">
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6862" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="6" x2="20" y2="6"></line>
            <line x1="4" y1="18" x2="20" y2="18"></line>
          </svg>
          <span class="input-value">{{ productType() }}</span>
          <svg class="chevron-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6862" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>

      <!-- Scadenza e Quantità (Row) -->
      <div class="form-row">
        <div class="form-group half-width">
          <label class="form-label">Scadenza</label>
          <div class="custom-input">
            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6862" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span class="input-value">{{ expiryDate() }}</span>
          </div>
        </div>

        <div class="form-group half-width">
          <label class="form-label">Quantità</label>
          <div class="custom-input">
            <input type="text" class="native-input" [value]="quantity()" readonly />
          </div>
        </div>
      </div>

    </form>
  </div>

  <footer class="sticky-footer">
    <button class="primary-button" (click)="saveLoad()">
      Salva prodotto in ingresso
    </button>
  </footer>
</main>
