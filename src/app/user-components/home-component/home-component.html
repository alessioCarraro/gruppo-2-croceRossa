<!-- src/app/components/scanner-component.html -->
<div class="app-container">
    <!-- Header Fisso -->
    <header class="app-header">
        <button class="logout-btn" (click)="onLogout()" aria-label="Esci">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
        </button>

        <div class="header-right">
            <div class="user-info">
                <span class="store-location">{{ storeName() }}</span>
                <span class="user-name">Ciao, {{ userName() }}</span>
                <div class="role-badge">User</div>
            </div>
            <div class="profile-avatar" aria-label="Profilo utente">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
        </div>
    </header>

    <!-- Corpo Scrollabile -->
    <main class="app-body">
        <div class="scanner-card">
            <div class="scanner-viewfinder">
                <div class="laser-line"></div>
            </div>
            <p class="scanner-instructions">Inquadra il QR della tessera famiglia</p>
        </div>

        <div class="action-section">
            <button class="primary-btn" (click)="scan()">
                Scansiona
            </button>

            <div class="divider">
                <span>oppure codice ID</span>
            </div>

            <div class="search-box">
                <div class="input-wrapper">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" [(ngModel)]="scanId" placeholder="Inserisci ID" />
                </div>
                <button class="search-btn" (click)="searchById()">Cerca</button>
            </div>
        </div>
    </main>

    <!-- Navbar Fissa -->
    <nav class="app-navbar">
        <button class="nav-item" [class.active]="activeTab() === 'magazzino'" (click)="setTab('magazzino')">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                    d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z">
                </path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            <span>Magazzino</span>
        </button>
        <button class="nav-item" [class.active]="activeTab() === 'scansione'" (click)="setTab('scansione')">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
            </svg>
            <span>Scansione</span>
        </button>
        <button class="nav-item" [class.active]="activeTab() === 'sedie'" (click)="setTab('sedie')">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                <line x1="8" y1="2" x2="8" y2="18"></line>
                <line x1="16" y1="6" x2="16" y2="22"></line>
            </svg>
            <span>Altre sedi</span>
        </button>
    </nav>
</div>
