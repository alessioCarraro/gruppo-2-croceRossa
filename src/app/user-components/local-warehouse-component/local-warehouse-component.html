<div class="app-container">

    <!-- Header -->
    <header class="header">
        <button class="btn-icon" (click)="goBack()" aria-label="Indietro">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
        </button>
        <h1 class="page-title">{{ pageTitle() }}</h1>
        <div class="badge-articles">{{ totalArticles() }}</div>
    </header>

    <main class="main-content">

        <!-- Barra di ricerca -->
        <div class="search-bar">
            <span class="icon-search" aria-hidden="true"></span>
            <input type="text" [value]="searchQry()" (input)="setSearchQry($any($event.target).value)"
                placeholder="Cerca nel catalogo..." aria-label="Cerca nel catalogo" />
        </div>

        <!-- Filtri orizzontali -->
        <nav class="filters-container" aria-label="Filtri categoria">
            <button class="chip" [class.active]="selectedCategory() === 'ALL'" (click)="setCategory('ALL')">
                Tutti
            </button>
            <button class="chip" [class.active]="selectedCategory() === 'Pasta'" (click)="setCategory('Pasta')">
                Pasta
            </button>
            <button class="chip" [class.active]="selectedCategory() === 'Carne'" (click)="setCategory('Carne')">
                Carne
            </button>
        </nav>

        <!-- Lista Catalogo -->
        <section class="catalog-list" aria-label="Catalogo prodotti">
            @for (product of filteredProducts(); track product.id) {
            <article class="catalog-item">

                <div class="item-icon-box">
                    <!-- Placeholder visivo per le icone specifiche basato sull'iconType -->
                    <span class="icon-placeholder" [ngClass]="'icon-' + product.iconType"></span>
                </div>

                <div class="item-details">
                    <h2 class="item-name">
                        {{ product.name }}
                    </h2>

                    <div class="item-meta">
                        @if (product.stock > 0) {
                        <span class="meta-label">Stock</span>
                        <span class="meta-value">{{ product.stock }}</span>
                        <span class="meta-separator">·</span>
                        <span class="meta-label">scad</span>
                        <span class="meta-value" [class.text-warning]="product.isExpiringSoon">
                            {{ product.expiry }}
                        </span>
                        } @else {
                        <span class="text-danger fw-bold">Esaurito</span>
                        }
                        <span class="meta-separator">·</span>
                        <span class="meta-label">{{ product.price }} T</span>
                    </div>
                </div>

                <button class="btn-restock"
                [class.btn-restock-danger]="product.stock === 0 && !isRequested(product.id)"
                [class.btn-restock-success]="isRequested(product.id)"
                (click)="toggleRestockRequest(product.id)">
                    {{ isRequested(product.id) ? 'Richiesto' : 'Richiedi' }}
                </button>
            </article>
            } @empty {
                <p class="no-products">Nessun prodotto trovato</p>
            }
        </section>

    </main>
</div>
