<div class="login-container">
    <header class="login-header">
        <div class="logo-wrapper">
            <img class="brand-logo-img" src="logo-food-network.png" alt="Food Network Aid Project" />
        </div>

        <h1 class="login-title">Accedi</h1>
        <p class="login-subtitle">Entra nel punto di distribuzione per iniziare le operazioni.</p>
    </header>

    <form class="login-form" (submit)="$event.preventDefault()">
        @if (loginError()) {
        <div class="error-banner" role="alert">
            <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>{{ loginError() }}</span>
        </div>
        }

        <div class="form-group">
            <label for="username" class="form-label">Nome utente</label>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <input id="username" type="text" class="form-input" [class.has-error]="loginError()" [value]="username()"
                    (input)="updateUsername($event)" placeholder="m.turelli" />
            </div>
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <input id="password" type="password" class="form-input" [class.has-error]="loginError()" [value]="password()"
                    (input)="updatePassword($event)" placeholder="password" />
            </div>
        </div>

        <div class="form-group">
            <label for="distributionPoint" class="form-label">Punto di distribuzione</label>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <!-- Menu personalizzato: l'elenco si apre sotto il campo e funziona bene da telefono -->
                <button id="distributionPoint" type="button" class="form-input select-trigger"
                    [disabled]="availableSites().length === 0" [attr.aria-expanded]="isSiteListOpen()"
                    (click)="toggleSiteList()">
                    <span [class.placeholder]="!distributionPoint()">
                        {{ distributionPoint() || (availableSites().length ? 'Seleziona una sede' : 'Inserisci prima il nome utente') }}
                    </span>
                    <svg class="select-chevron" [class.open]="isSiteListOpen()" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
            </div>
            @if (isSiteListOpen()) {
            <ul class="site-list">
                @for (site of availableSites(); track site.id) {
                <li>
                    <button type="button" class="site-option" [class.selected]="site.name === distributionPoint()"
                        (click)="selectSite(site.name)">
                        {{ site.name }}
                    </button>
                </li>
                }
            </ul>
            }
        </div>

        <button type="submit" class="submit-btn" [disabled]="isLoading()" (click)="onLogin()">
            <span>{{ isLoading() ? 'Accesso in corso...' : 'Accedi' }}</span>
            <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </button>
    </form>

    <footer class="login-footer">
        Validazione simulata via AuthService · dati sintetici
    </footer>
</div>
