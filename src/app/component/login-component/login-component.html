<div class="login-container">
  <header class="login-header">
    <div class="logo-wrapper">
      <svg class="brand-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 20C35 20 25 30 25 45C25 60 40 65 50 80C60 65 75 60 75 45C75 30 65 20 50 20Z" stroke="#121212" stroke-width="6" stroke-linecap="round"/>
        <path d="M35 45C35 37 42 32 50 32C58 32 65 37 65 45C65 53 55 58 50 70C45 58 35 53 35 45Z" stroke="#121212" stroke-width="6" stroke-linecap="round"/>
      </svg>
      <div class="brand-title-group">
        <span class="brand-food">FOOD</span>
        <span class="brand-network">NETWORK</span>
        <span class="brand-aid">AID PROJECT</span>
      </div>
    </div>
    
    <h1 class="login-title">Accedi</h1>
    <p class="login-subtitle">Entra nel punto di distribuzione per iniziare le operazioni.</p>
  </header>

  <form class="login-form" (submit)="$event.preventDefault()">
    <div class="form-group">
      <label for="username" class="form-label">Nome utente</label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <input 
          id="username" 
          type="text" 
          class="form-input" 
          [value]="username()" 
          (input)="updateUsername($event)"
          placeholder="m.turelli"
        />
      </div>
    </div>

    <div class="form-group">
      <label for="password" class="form-label">Password</label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <input 
          id="password" 
          type="password" 
          class="form-input" 
          [value]="password()" 
          (input)="updatePassword($event)"
          placeholder="password"
        />
      </div>
    </div>

    <div class="form-group">
      <label for="distributionPoint" class="form-label">Punto di distribuzione</label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        <input 
          id="distributionPoint" 
          type="text" 
          class="form-input" 
          [value]="distributionPoint()" 
          (input)="updateDistributionPoint($event)"
          placeholder="Negozio Legnano — Via Gilardelli"
        />
      </div>
    </div>

    <button type="submit" class="submit-btn" (click)="onLogin()">
      <span>Accedi</span>
      <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </form>

  <footer class="login-footer">
    Validazione simulata via AuthService · dati sintetici
  </footer>
</div>
