<main class="app-container">
  
  <!-- Header -->
  <header class="header">
    <button class="icon-button back-btn" aria-label="Indietro" (click)="goBack()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <h1 class="title">In esaurimento</h1>
    <div class="badge-notification" [attr.aria-label]="notificationCount() + ' articoli in esaurimento'">
    {{ notificationCount() }} art.
  </div>
  </header>

  <!-- Descrizione -->
  <p class="description">
    Aggiungi i prodotti 
    direttamente all'ordine per il magazzino centrale.
  </p>

  <!-- Lista Prodotti -->
  <section class="products-card">
    @for (product of products(); track product.id; let isLast = $last) {
      <article class="product-item" [class.border-bottom]="!isLast">
        
        <div class="product-info">
          <h2 class="product-name">{{ product.name }}</h2>
          <p class="product-status" [class.text-red]="product.isOutOfStock" [class.text-warning]="!product.isOutOfStock">
            {{ product.stockStatus }}
          </p>
        </div>

        <div class="product-action">
          @if (product.addedToOrder) {
            <!-- Trasformato da div a button per semantica e interattività -->
            <button 
              class="status-added" 
              (click)="toggleOrderStatus(product.id)"
              aria-label="Rimuovi prodotto dall'ordine"
              title="Clicca per annullare">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              In ordine
            </button>
          } @else {
            <button class="add-btn" (click)="toggleOrderStatus(product.id)">
              Ordina
            </button>
          }
        </div>

      </article>
    }
  </section>

</main>
