<div class="app-container">
  
  <!-- Viewport Fotocamera -->
  <section class="camera-viewport">
    <header class="header">
      <button class="back-btn" (click)="goBack()" aria-label="Torna indietro">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
        </svg>
      </button>
      <h1 class="page-title">Scansiona QR</h1>
    </header>

    <!-- Reticolo di Scansione -->
    <div class="scanner-frame" aria-hidden="true">
      <div class="corner top-left"></div>
      <div class="corner top-right"></div>
      <div class="corner bottom-left"></div>
      <div class="corner bottom-right"></div>
      <div class="laser-line"></div>
    </div>

    <p class="instruction-text">Inquadra il QR della tessera famiglia</p>
  </section>

  <!-- Pannello Azioni -->
  <section class="action-panel">
    <button class="btn-primary" (click)="simulateScan()">
      Simula scansione riuscita
    </button>

    <div class="divider">
      <span class="divider-text">oppure codice ID</span>
    </div>

    <div class="search-container">
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input 
        type="text" 
        class="search-input" 
        [value]="manualId()" 
        (input)="updateId($event)"
        placeholder="Inserisci ID"
        aria-label="Ricerca per codice ID manuale"
      />
      <button class="btn-search" (click)="searchId()">Cerca</button>
    </div>
  </section>
  
</div>
