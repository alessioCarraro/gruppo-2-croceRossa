<main class="app-container">
  <app-notification-card />
  <div class="scrollable-content">
    <header class="header">
      <button type="button" class="back-button" aria-label="Torna indietro" (click)="goBack()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 18L9 12L15 6" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1 class="title">Carico esistente</h1>
    </header>

    <form class="form-container" (submit)="saveLoad(); $event.preventDefault()">
      
      <!-- Macro-categoria (Omissis per brevità, resta invariato) -->
      <div class="form-group">
        <label class="form-label">Macro-categoria</label>
        <div class="custom-input">
          <span class="input-value">{{ macroCategory() }}</span>
          <svg class="chevron-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6862" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          </svg>
        </div>
      </div>

      <!-- Categoria (Omissis per brevità, resta invariato) -->
      <div class="form-group">
        <label class="form-label">Categoria</label>
        <div class="custom-input">
          <span class="input-value">{{ category() }}</span>
          <svg class="chevron-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6862" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          </svg>
        </div>
      </div>

      <!-- Tipo prodotto (Omissis per brevità, resta invariato) -->
      <div class="form-group">
        <label class="form-label">Tipo prodotto</label>
        <div class="custom-input">
          <span class="input-value">{{ productType() }}</span>
          <svg class="chevron-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6862" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          </svg>
        </div>
      </div>

      <!-- Banner giacenza totale del prodotto (stesso stile del super admin) -->
      <div class="stock-alert">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16537A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <span>Giacenza totale: <strong>{{ currentStock() }}</strong></span>
      </div>

      <!-- Scadenza e Quantità (Row) -->
       <div class="form-row">
        
        <!-- Scadenza -->
        <div class="form-group half-width">
          <label class="form-label" for="expiry-date">Scadenza</label>
          <!-- Il wrapper torna ad essere un div per non espandere l'area cliccabile -->
          <div class="custom-input" [class.has-error]="expiryError()">
            <!-- La label avvolge solo l'icona per permettere il click anche su di essa -->
            <label for="expiry-date" class="icon-label">
              <svg class="input-icon cursor-pointer" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6862" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
            </label>
            <input 
              id="expiry-date"
              type="date" 
              class="native-input date-input" 
              [value]="expiryDate()" 
              (input)="updateExpiryDate($event)"
            />
          </div>
          @if (expiryError()) {
            <p class="error-text">{{ expiryError() }}</p>
          }
        </div>

        <!-- Quantità -->
        <div class="form-group half-width">
          <label class="form-label" for="quantity-input">Quantità</label>
          <div class="custom-input" [class.has-error]="quantityError()">
            <input 
              id="quantity-input"
              type="number" 
              min="0"
              class="native-input" 
              [value]="quantity()" 
              (input)="updateQuantity($event)" 
            />
          </div>
          @if (quantityError()) {
            <p class="error-text">{{ quantityError() }}</p>
          }
        </div>
      </div>




    </form>
  </div>

  <footer class="sticky-footer">
    <button class="primary-button" [disabled]="isSaving()" (click)="saveLoad()">
      Salva prodotto in ingresso
    </button>
  </footer>
</main>
